<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>Para Kiara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Parisienne&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4EC;
    --wine:#7A2438;
    --wine-deep:#3D1220;
    --wine-deeper:#2A0C16;
    --gold:#C9A15E;
    --gold-soft:#E4CB9B;
    --ink:#2B1014;
    --ink-soft:#5C2A32;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--wine-deeper);
    font-family:'EB Garamond', serif;
  }
  .display{font-family:'Cormorant Garamond', serif;}
  .script{font-family:'Parisienne', cursive;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .stage{
    position:fixed;
    inset:0;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%, #4a1c2a 0%, var(--wine-deep) 45%, var(--wine-deeper) 100%);
    overflow:hidden;
  }

  .ambient{position:absolute; inset:0; pointer-events:none;}
  .ambient-heart{
    position:absolute; bottom:-30px; color:var(--gold-soft); opacity:0;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    12%{opacity:0.28;}
    88%{opacity:0.16;}
    100%{transform:translateY(-105vh) translateX(var(--drift,0px)) rotate(20deg); opacity:0;}
  }

  .scene{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ENVELOPE */
  .envelope-wrap{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2rem;
    text-align:center;
    padding:6vh 8vw;
    transition:opacity 0.6s ease, transform 0.6s ease;
    z-index:5;
  }
  .envelope-wrap.hidden{opacity:0; transform:scale(0.92); pointer-events:none;}

  .eyebrow{
    font-style:italic;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:0.68rem;
    color:var(--gold-soft);
    opacity:0.85;
  }
  .for-name{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(2.6rem, 13vw, 4rem);
    color:var(--cream);
  }

  .envelope{
    position:relative;
    width:min(76vw, 260px);
    aspect-ratio:3/2;
    cursor:pointer;
  }
  .env-body{
    position:absolute; inset:0;
    background:linear-gradient(180deg, #f6e9dd, #eddcc8);
    border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,0.45);
  }
  .env-flap{
    position:absolute;
    top:0; left:0; width:100%; height:60%;
    background:linear-gradient(160deg, #e9d4bd, #d9bfa0);
    clip-path:polygon(0 0, 100% 0, 50% 85%);
    transform-origin:top;
    transition:transform 0.7s cubic-bezier(.6,.05,.3,1);
    border-radius:6px 6px 0 0;
    z-index:3;
  }
  .envelope.open .env-flap{transform:rotateX(180deg);}
  .seal{
    position:absolute;
    top:38%; left:50%;
    transform:translate(-50%,-50%);
    width:46px; height:46px;
    background:radial-gradient(circle at 35% 30%, #9a3450, var(--wine));
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
    z-index:4;
    transition:opacity 0.3s ease, transform 0.4s ease;
    animation:sealPulse 2.2s ease-in-out infinite;
  }
  .envelope.open .seal{opacity:0; transform:translate(-50%,-50%) scale(0.4);}
  .seal svg{width:20px; height:20px; fill:var(--gold-soft);}
  @keyframes sealPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.06);}
  }
  .env-letter-peek{
    position:absolute;
    left:8%; right:8%; bottom:6%;
    height:70%;
    background:var(--cream);
    border-radius:4px;
    box-shadow:0 -2px 6px rgba(0,0,0,0.08);
    z-index:2;
    transform:translateY(6%);
    transition:transform 0.7s cubic-bezier(.6,.05,.3,1) 0.15s;
  }
  .envelope.open .env-letter-peek{transform:translateY(-18%);}

  .tap-hint{
    font-style:italic;
    color:var(--gold-soft);
    opacity:0.75;
    font-size:0.9rem;
  }

  /* LETTER CARD */
  .card-wrap{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5vh 7vw;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
    z-index:4;
  }
  .card-wrap.active{opacity:1; pointer-events:auto;}

  .progress{
    display:flex;
    gap:6px;
    margin-bottom:2.4rem;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:rgba(228,203,155,0.3);
    transition:background 0.3s ease, transform 0.3s ease;
  }
  .dot.done{background:var(--gold-soft); transform:scale(1.15);}

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    min-height:38vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1.5rem;
  }
  .msg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:clamp(1.5rem, 6.4vw, 2rem);
    line-height:1.5;
    color:var(--cream);
    opacity:0;
    transform:translateY(14px) scale(0.98);
    transition:opacity 0.55s ease, transform 0.55s ease;
  }
  .msg.show{opacity:1; transform:translateY(0) scale(1);}
  .msg em{font-style:italic; color:var(--gold-soft);}
  .msg.accent{font-family:'Parisienne', cursive; font-size:clamp(1.9rem, 9vw, 2.6rem); color:var(--gold-soft);}

  .tap-forward{
    margin-top:2.4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.5rem;
    color:var(--gold-soft);
    opacity:0.7;
  }
  .tap-forward span{font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase;}
  .tap-forward svg{width:16px; height:16px; animation:pulseArrow 1.8s ease-in-out infinite;}
  @keyframes pulseArrow{
    0%,100%{transform:translateX(0); opacity:0.6;}
    50%{transform:translateX(5px); opacity:1;}
  }

  .heart-final-btn{
    margin-top:2.2rem;
    width:74px; height:74px;
    border:none; background:none; cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .heart-final-btn.show{display:flex;}
  .heart-final-btn svg{
    width:52px; height:52px;
    fill:var(--wine);
    filter:drop-shadow(0 0 14px rgba(201,161,94,0.5));
    animation:pulseHeart 1.5s ease-in-out infinite;
  }
  @keyframes pulseHeart{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.1);}
  }

  .signature{
    margin-top:1.6rem;
    max-height:0;
    overflow:hidden;
    transition:max-height 1s ease;
    text-align:center;
  }
  .signature.open{max-height:200px;}
  .signature-name{
    font-family:'Parisienne', cursive;
    font-size:2.1rem;
    color:var(--gold-soft);
    display:block;
    margin-top:0.6rem;
  }

  .burst-heart{
    position:fixed;
    pointer-events:none;
    z-index:50;
    color:var(--gold-soft);
    opacity:0;
    animation:burst 1.1s ease-out forwards;
  }
  @keyframes burst{
    0%{opacity:1; transform:translate(0,0) scale(0.5) rotate(0deg);}
    100%{opacity:0; transform:translate(var(--bx), var(--by)) scale(1.15) rotate(var(--br));}
  }

  .restart{
    position:absolute;
    bottom:calc(3vh + env(safe-area-inset-bottom));
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(228,203,155,0.5);
    background:none;
    border:none;
    opacity:0;
    transition:opacity 0.5s ease;
    z-index:6;
  }
  .restart.show{opacity:1;}
</style>
</head>
<body>

<div class="stage">
  <div class="ambient" id="ambient"></div>

  <div class="scene">
    <!-- ENVELOPE -->
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="eyebrow">para</div>
      <h1 class="for-name">Kiara</h1>
      <div class="envelope" id="envelope">
        <div class="env-letter-peek"></div>
        <div class="env-body"></div>
        <div class="env-flap"></div>
        <div class="seal">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.3 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5c3.3 0 5.1 3.4 3.6 6.7C19.5 16.4 12 21 12 21z"/></svg>
        </div>
      </div>
      <p class="tap-hint">toca el sobre</p>
    </div>

    <!-- CARD MESSAGES -->
    <div class="card-wrap" id="cardWrap">
      <div class="progress" id="progress"></div>
      <div class="card" id="card"></div>
      <div class="tap-forward" id="tapForward">
        <span>toca para seguir</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <button class="heart-final-btn" id="finalHeartBtn" aria-label="corazón final">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.3 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5c3.3 0 5.1 3.4 3.6 6.7C19.5 16.4 12 21 12 21z"/></svg>
      </button>
      <div class="signature" id="signature">
        <p style="font-family:'Cormorant Garamond',serif; color:var(--cream); font-size:1.05rem; line-height:1.6;">Gracias por estar en mi vida.<br>Te amo, amorcito.</p>
        <span class="signature-name">— tu novio</span>
      </div>
    </div>
  </div>

  <button class="restart" id="restartBtn">volver a empezar</button>
</div>

<script>
  const heartPath = 'M12 21s-7.5-4.6-10-9.3C.5 8.4 2.3 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5c3.3 0 5.1 3.4 3.6 6.7C19.5 16.4 12 21 12 21z';

  const ambient = document.getElementById('ambient');
  function spawnAmbient(){
    const h = document.createElement('div');
    h.className = 'ambient-heart';
    const size = 12 + Math.random()*16;
    h.style.left = (Math.random()*100) + 'vw';
    h.style.setProperty('--drift', (Math.random()*60-30) + 'px');
    h.style.animationDuration = (9 + Math.random()*7) + 's';
    h.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor"><path d="${heartPath}"/></svg>`;
    ambient.appendChild(h);
    setTimeout(()=>h.remove(), 17000);
  }
  for(let i=0;i<4;i++) setTimeout(spawnAmbient, i*1300);
  setInterval(spawnAmbient, 2400);

  function burstAt(x, y, count){
    for(let i=0;i<count;i++){
      const b = document.createElement('div');
      b.className = 'burst-heart';
      b.innerHTML = '♥';
      const angle = Math.random()*Math.PI*2;
      const dist = 50 + Math.random()*130;
      b.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
      b.style.setProperty('--by', (Math.sin(angle)*dist - 30) + 'px');
      b.style.setProperty('--br', (Math.random()*60-30) + 'deg');
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      b.style.fontSize = (12 + Math.random()*16) + 'px';
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), 1150);
    }
  }

  const messages = [
    "Amorcito, te extraño.",
    "No hace falta que pase nada especial, simplemente te pienso.",
    "Me gusta tu risa, tus locuras y hasta tus días de mal genio.",
    "Contigo todo es más fácil.",
    "accent::Te amo mucho, cariño."
  ];

  const envelopeWrap = document.getElementById('envelopeWrap');
  const envelope = document.getElementById('envelope');
  const cardWrap = document.getElementById('cardWrap');
  const card = document.getElementById('card');
  const progress = document.getElementById('progress');
  const tapForward = document.getElementById('tapForward');
  const finalHeartBtn = document.getElementById('finalHeartBtn');
  const signature = document.getElementById('signature');
  const restartBtn = document.getElementById('restartBtn');

  let idx = 0;
  let opened = false;

  messages.forEach(()=>{
    const d = document.createElement('div');
    d.className = 'dot';
    progress.appendChild(d);
  });
  const dots = progress.querySelectorAll('.dot');

  function renderMessage(i){
    card.innerHTML = '';
    const isAccent = messages[i].startsWith('accent::');
    const text = isAccent ? messages[i].replace('accent::','') : messages[i];
    const el = document.createElement('div');
    el.className = 'msg' + (isAccent ? ' accent' : '');
    el.innerHTML = text;
    card.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
    dots.forEach((d, di)=> d.classList.toggle('done', di <= i));

    if(i === messages.length - 1){
      tapForward.style.display = 'none';
      finalHeartBtn.classList.add('show');
    }
  }

  function openEnvelope(){
    if(opened) return;
    opened = true;
    envelope.classList.add('open');
    const rect = envelope.getBoundingClientRect();
    burstAt(rect.left + rect.width/2, rect.top + rect.height*0.35, 10);
    setTimeout(()=>{
      envelopeWrap.classList.add('hidden');
      cardWrap.classList.add('active');
      renderMessage(idx);
    }, 900);
  }

  envelope.addEventListener('click', openEnvelope);

  cardWrap.addEventListener('click', (e)=>{
    if(e.target.closest('#finalHeartBtn')) return;
    if(idx < messages.length - 1){
      idx++;
      renderMessage(idx);
      burstAt(e.clientX, e.clientY, 6);
    }
  });

  finalHeartBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const rect = finalHeartBtn.getBoundingClientRect();
    burstAt(rect.left + rect.width/2, rect.top + rect.height/2, 24);
    signature.classList.add('open');
    finalHeartBtn.style.pointerEvents = 'none';
    finalHeartBtn.style.animation = 'none';
    setTimeout(()=> restartBtn.classList.add('show'), 900);
  });

  restartBtn.addEventListener('click', ()=>{
    idx = 0;
    opened = false;
    finalHeartBtn.classList.remove('show');
    finalHeartBtn.style.pointerEvents = 'auto';
    signature.classList.remove('open');
    tapForward.style.display = 'flex';
    cardWrap.classList.remove('active');
    envelope.classList.remove('open');
    envelopeWrap.classList.remove('hidden');
    restartBtn.classList.remove('show');
    dots.forEach(d=>d.classList.remove('done'));
  });
</script>

</body>
</html>
